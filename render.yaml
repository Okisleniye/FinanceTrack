services:
  - type: web
    name: financetrack
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/app/data/FinanceTrack.db
    # Optional persistent disk for paid tiers:
    # disk:
    #   name: financetrack-data
    #   mountPath: /app/data
    #   sizeGB: 1
